<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Page</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container{
            width: 400px;
            background: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1{
            text-align: center;
            color: #333;
        }

        label{
            font-weight: bold;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button{
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background: darkblue;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Form</h1>

        <form>
            <label>Student Name</label>
            <input type="text" placeholder="Enter Name">

            <label>Email</label>
            <input type="email" placeholder="Enter Email">

            <label>Mobile Number</label>
            <input type="text" placeholder="Enter Mobile Number">

            <label>Course</label>
            <input type="text" placeholder="Enter Course">

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
